[package]
name = "tyled"
version = "0.1.0"
edition = "2024"

[features]
default = []
dev = ["bevy/dynamic_linking", "bevy/file_watcher", "dep:bevy-inspector-egui", "bevy_ecs_tiled/debug"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["2d"] }
bevy-inspector-egui = { version = "0.37.0", optional = true }
bevy_ecs_tiled = { version = "0.13", features = ["user_properties"] }
# Pinned to a commit on the crate's main branch until a crates.io release targets
# Bevy 0.19 (fix merged in doonv/bevy_smooth_pixel_camera#16). Swap to a version pin
# once one ships.
bevy_smooth_pixel_camera = { git = "https://github.com/doonv/bevy_smooth_pixel_camera", rev = "01c14805676a9542e0b8386f5e98ba9925223177" }
bevy_spritesheet_animation = "7.0"
bevy_tweening = "0.16"
leafwing-input-manager = { version = "0.21", features = ["timing"] }
rand = "0.9"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
